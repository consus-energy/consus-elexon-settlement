[project]
name = "consus-elexon-settlement"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "xlrd>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consus_elexon_settlement"]
artifacts = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "xlrd>=2.0.2",
]

[project.scripts]
consus-settlement = "consus_elexon_settlement.cli:main"
