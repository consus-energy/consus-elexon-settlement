[project]
name = "consus-elexon-settlement"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.4",
    # The archive imports these lazily so unit tests need no GCS credentials.
    # That lazy import is why their absence was invisible until a deployed
    # container tried to write its first file.
    "google-cloud-storage>=2.18",
    "flask>=3.0",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "xlrd>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consus_elexon_settlement"]
artifacts = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "volume: capacity tests at portfolio scale. Minutes, not seconds. Excluded from the default run.",
]
addopts = "-m 'not volume'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "xlrd>=2.0.2",
    "pyftpdlib>=2.0",
    "psycopg[binary]>=3.3.4",
    "flask>=3.0",
    "gunicorn>=23.0",
]

[project.scripts]
consus-settlement = "consus_elexon_settlement.cli:main"


